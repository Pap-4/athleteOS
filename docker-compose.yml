# Local Postgres for development: `docker compose up -d`
services:
  postgres:
    image: postgres:16
    container_name: athleteos-postgres
    environment:
      POSTGRES_USER: athleteos
      POSTGRES_PASSWORD: athleteos
      POSTGRES_DB: athleteos
    ports:
      - '5432:5432'
    volumes:
      - athleteos-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U athleteos -d athleteos']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  athleteos-pgdata:
